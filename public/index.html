<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureBank — Modern Digital Banking & Security</title>
  
  <!-- Inter Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Core Stylesheet -->
  <link rel="stylesheet" href="/css/styles.css">
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏦</text></svg>">
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="#" class="brand-logo" onclick="if(State.getUser()) { State.setView(State.getUser().role === 'admin' ? 'admin' : 'dashboard'); } else { State.setView('landing'); } return false;">
        <div class="brand-icon-shield">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
        </div>
        <span>SecureBank</span>
        <span class="brand-badge">PRO</span>
      </a>

      <ul class="nav-links" id="nav-links-container">
        <!-- Dynamically rendered by app.js -->
      </ul>

      <div class="nav-actions" id="nav-actions-container">
        <!-- Dynamically rendered by app.js -->
      </div>
    </div>
  </nav>

  <!-- Dynamic Main Content Area -->
  <main id="main-content" style="flex: 1;">
    <!-- Content injected based on active route -->
  </main>

  <!-- Public Customer-Facing Footer -->
  <footer style="background-color:#ffffff; border-top:1px solid var(--border-subtle); padding:2.5rem 0; margin-top:auto;">
    <div class="container" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1.5rem;">
      <div>
        <div style="display:flex; align-items:center; gap:0.5rem; font-weight:700; color:var(--text-primary); font-size:1.05rem;">
          <div style="width:24px; height:24px; background:var(--teal-600); border-radius:4px; display:flex; align-items:center; justify-content:center; color:#fff;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
          </div>
          SecureBank Financial Services
        </div>
        <p style="color:var(--text-muted); font-size:0.8rem; margin-top:0.4rem;">
          Licensed banking institution. 256-bit encryption. Automated fraud monitoring active.
        </p>
      </div>

      <div style="display:flex; gap:2rem; font-size:0.85rem; color:var(--text-secondary);">
        <a href="#security" onclick="navigateToLandingSection('security')">Security Architecture</a>
        <a href="#features" onclick="navigateToLandingSection('features')">Transfer Protocols</a>
        <a href="javascript:void(0)" onclick="State.showToast('Compliance and privacy policies are active.', 'info')">Privacy Policy</a>
        <a href="javascript:void(0)" onclick="State.showToast('SecureBank Customer Support: support@securebank.com', 'info')">Support</a>
      </div>

      <div style="font-size:0.8rem; color:var(--text-muted);">
        &copy; 2026 SecureBank Inc. All rights reserved.
      </div>
    </div>
  </footer>

  <!-- Global Modal Dialog Container -->
  <div id="global-modal" class="modal-overlay">
    <div id="global-modal-content" class="modal-content">
      <!-- Modal contents dynamically injected -->
    </div>
  </div>

  <!-- Real-Time Toast Notifications Container -->
  <div id="toast-container"></div>

  <!-- Application Modules -->
  <script src="/js/api.js"></script>
  <script src="/js/state.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
